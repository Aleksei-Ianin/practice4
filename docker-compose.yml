services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: calculator
      POSTGRES_PASSWORD: calcpass
      POSTGRES_DB: calc_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculator -d calc_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DSN: "postgres://calculator:calcpass@postgres:5432/calc_db?sslmode=disable"

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api
    environment:
      API_URL: "http://api:8080"